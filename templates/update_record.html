<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Record</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 0.25rem;
            text-align: center; /* Center text inside form fields */
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .alert {
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">Update Record</a>
        <div class="ml-auto">
            <a href="/logout" class="btn btn-light">Logout</a>
            <a href="/home" class="btn btn-light">Home</a>
        </div>
    </nav>
    <div class="container mt-4">
        <form action="{{ url_for('save_update') }}" method="post">
            <input type="hidden" name="record_id" value="{{ record[1] }}">
            <div class="form-group" style="text-align: center;">
                <label for="car_type">نوع خودرو</label>
                <input type="text" id="car_type" name="car_type" class="form-control" value="{{ record[0] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="darkhast_number">شماره درخواست</label>
                <input type="text" id="darkhast_number" name="darkhast_number" class="form-control" value="{{ record[1] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="paziresh_number">شماره پذیرش</label>
                <input type="text" id="paziresh_numberr" name="paziresh_number" class="form-control" value="{{ record[12] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="rabet_name">نام رابط</label>
                <input type="text" id="rabet_name" name="rabet_name" class="form-control" value="{{ record[2] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="rabet_phone">شماره رابط</label>
                <input type="text" id="rabet_phone" name="rabet_phone" class="form-control" value="{{ record[3] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="mablagh_havaleh">قیمت حواله(تومان)</label>
                <input type="number" id="mablagh_havaleh" name="mablagh_havaleh" class="form-control" value="{{ record[4] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="mablagh_havaleh">مبلغ واریزی(تومان)</label>
                <input type="number" id="mablagh_havaleh" name="variz_mablagh" class="form-control" value="{{ record[10] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="mablagh_havaleh">مبلغ کل(تومان)</label>
                <input type="number" id="mablagh_havaleh" name="final_mablagh" class="form-control" value="{{ record[11] }}" readonly>
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="havale_city">شهر حواله</label>
                <input type="text" id="havale_city" name="havale_city" class="form-control" value="{{ record[5] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="havaleh_owner_name">نام صاحب حواله</label>
                <input type="text" id="havaleh_owner_name" name="havaleh_owner_name" class="form-control" value="{{ record[6] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="havaleh_owner_mellicode">کد ملی صاحب حواله</label>
                <input type="text" id="havaleh_owner_mellicode" name="havaleh_owner_mellicode" class="form-control" value="{{ record[7] }}">
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="sakha_password">رمز سخا</label>
                <input type="text" id="sakha_password" name="sakha_password" class="form-control" value="{{ record[8] }}">
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
