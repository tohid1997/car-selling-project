<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Record</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 0.25rem;
            text-align: center;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .alert {
            border-radius: 0.25rem;
        }
        .required::after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">Update Record</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:5000/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:5000/first_info/search_for_saham">Back</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-4">
        <form action="{{ url_for('save_saham_update') }}" method="post">
            <input type="hidden" name="record_id" value="{{ id }}">
            <input type="hidden" name="mablagh_kol" value="{{ mablagh_kol }}">
            <div id="dynamic-form">
                {% for row in saham_info %}
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="person_name">نام شخص</label>
                        <input type="text" id="person_name" name="person_name[]" class="form-control" value="{{ row[0] }}" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="saham_percent">درصد سهام</label>
                        <input type="number" id="saham_percent" name="saham_percent[]" class="form-control" value="{{ row[1] }}" readonly>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="mosharekat_mablagh">مبلغ مشارکت</label>
                        <input type="number" id="mosharekat_mablagh" name="mosharekat_mablagh[]" class="form-control" value="{{ row[2] }}" required>
                    </div>
                </div>
                {% endfor %}
            </div>
            <button type="button" class="btn btn-secondary" id="add-row">Add Row</button>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>
    <script>
        jalaliDatepicker.startWatch();
    
        document.getElementById('add-row').addEventListener('click', function() {
            var newRow = document.createElement('div');
            newRow.className = 'form-row';
            newRow.innerHTML = `
                <div class="form-group col-md-4">
                    <label for="person_name">نام شخص</label>
                    <input type="text" id="person_name" name="person_name[]" class="form-control" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="saham_percent">درصد سهام</label>
                    <input type="number" id="saham_percent" name="saham_percent[]" class="form-control" readonly>
                </div>
                <div class="form-group col-md-4">
                    <label for="mosharekat_mablagh">مبلغ مشارکت</label>
                    <input type="number" id="mosharekat_mablagh" name="mosharekat_mablagh[]" class="form-control" required>
                </div>
            `;
            document.getElementById('dynamic-form').appendChild(newRow);
        });
    </script>    
</body>
</html>
