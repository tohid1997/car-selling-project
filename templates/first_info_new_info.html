<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Info</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-light-blue { background-color: #add8e6; }
        .bg-light-green { background-color: #90ee90; }
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
        .navbar-custom .nav-link:hover {
            color: #d4d4d4;
        }
        .card:hover {
            transform: scale(1.05);
            transition: transform 0.2s;
        }
        .card {
            margin-bottom: 15px; /* Add margin to the bottom of each card */
            height: 100%; /* Ensure cards are of equal height */
        }
        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="localhost:5000/first_info/new_info">New Info Page</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/first_info">First Info</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <!-- Flash message section -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert alert-dismissible fade show" role="alert">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">×</span>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form action="/first_info/new_info" method="POST">
            <div class="form-group">
                <label for="car_type">Car Type:</label>
                <input type="text" class="form-control" id="car_type" name="car_type" required>
            </div>
            <div class="form-group">
                <label for="darkhast_number">Darkhast Number:</label>
                <input type="text" class="form-control" id="darkhast_number" name="darkhast_number" required>
            </div>
            <div class="form-group">
                <label for="rabet_name">Rabet Name:</label>
                <input type="text" class="form-control" id="rabet_name" name="rabet_name" required>
            </div>
            <div class="form-group">
                <label for="rabet_phone">Rabet Phone:</label>
                <input type="text" class="form-control" id="rabet_phone" name="rabet_phone" required>
            </div>
            <div class="form-group">
                <label for="mablagh_havaleh">Mablagh Havaleh (Toman):</label>
                <input type="number" class="form-control" id="mablagh_havaleh" name="mablagh_havaleh" required>
            </div>
            <div class="form-group">
                <label for="havale_city">Havale City:</label>
                <input type="text" class="form-control" id="havale_city" name="havale_city" required>
            </div>
            <div class="form-group">
                <label for="havaleh_owner_name">Havaleh Owner Name:</label>
                <input type="text" class="form-control" id="havaleh_owner_name" name="havaleh_owner_name" required>
            </div>
            <div class="form-group">
                <label for="havaleh_owner_mellicode">Havaleh Owner MelliCode:</label>
                <input type="text" class="form-control" id="havaleh_owner_mellicode" name="havaleh_owner_mellicode" required>
            </div>
            <div class="form-group">
                <label for="sakha_password">Sakha Password:</label>
                <input type="text" class="form-control" id="sakha_password" name="sakha_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
