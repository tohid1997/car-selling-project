<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert New Record</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 0.25rem;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .alert {
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">Insert New Record</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:5000/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mt-3">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">×</span>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form id="insertForm" method="POST" action="{{ url_for('first_info_new_info') }}">
            <div class="form-group" style="text-align: center;">
                <label for="Car_type">نوع خودرو</label>
                <input type="text" class="form-control" style="text-align: center;" id="Car_type" name="car_type" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Darkhast_number">شماره درخواست</label>
                <input type="text" class="form-control" style="text-align: center;" id="Darkhast_number" name="darkhast_number" value="" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Rabet_Name">نام  رابط</label>
                <input type="text" class="form-control" style="text-align: center;" id="Rabet_Name" name="rabet_name" value="" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Rabet_Phone">شماره تلفن رابط</label>
                <input type="text" class="form-control" style="text-align: center;" id="Rabet_Phone" name="rabet_phone" required>
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Mablagh_Havaleh">مبلغ حواله(تومن)</label>
                <input type="number" class="form-control" style="text-align: center;" id="Mablagh_Havaleh" name="mablagh_havaleh" value="" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Havale_City">شهر حواله</label>
                <input type="text" class="form-control" style="text-align: center;" id="Havale_City" name="havale_city" value="" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Havaleh_Owner_Name">نام صاحب حواله</label>
                <input type="text" class="form-control" style="text-align: center;" id="Havaleh_Owner_Name" name="havaleh_owner_name" value="" >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Havaleh_Owner_MelliCode">کد ملی صاحب حواله</label>
                <input type="text" class="form-control" style="text-align: center;" id="Havaleh_Owner_MelliCode" name="havaleh_owner_mellicode" required >
            </div>
            <div class="form-group" style="text-align: center;">
                <label for="Sakha_Password">رمز سخا</label>
                <input type="text" class="form-control" style="text-align: center;" id="Sakha_Password" name="sakha_password" value="" >
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
