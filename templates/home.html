<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-light-blue { background-color: #add8e6; }
        .bg-light-green { background-color: #90ee90; }
        .bg-light-red { background-color: #ffcccb; }
        .bg-light-purple { background-color: #dda0dd; }
        .bg-light-pink { background-color: #ffb6c1; }
        .card:hover {
            transform: scale(1.05);
            transition: transform 0.2s;
        }
        .card {
            margin-bottom: 15px; /* Add margin to the bottom of each card */
            height: 100%; /* Ensure cards are of equal height */
        }
        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .navbar-custom {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://source.unsplash.com/random/1920x1080');
            background-size: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%28255, 255, 255, 0.5%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
        }
        .btn-custom {
            background-color: #ffcccb;
            border-color: #ffcccb;
            color: #000;
        }
        .btn-custom:hover {
            background-color: #ff9999;
            border-color: #ff9999;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
        <a class="navbar-brand" href="#">Home Page</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                {% if session['username'] == 'tohid' %}
                <li class="nav-item">
                    <a class="nav-link" href="/register">Register New User</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card bg-light-blue text-dark">
                    <div class="card-body">
                        <h5 class="card-title">اطلاعات اولیه</h5>
                        <p class="card-text">شامل نام رابط، نام صاحب حواله و...</p>
                        <a href="http://localhost:5000/first_info" class="stretched-link"></a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-light-green text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 2</h5>
                        <p class="card-text">Content for section 2.</p>
                        <a href="http://localhost:5000/upload_page" class="stretched-link"></a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-light-red text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 3</h5>
                        <p class="card-text">Content for section 3.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <div class="card bg-light-purple text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 4</h5>
                        <p class="card-text">Content for section 4.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card bg-light-pink text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 5</h5>
                        <p class="card-text">Content for section 5.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
