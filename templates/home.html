<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-light-blue { background-color: #add8e6; }
        .bg-light-green { background-color: #90ee90; }
        .bg-light-red { background-color: #ffcccb; }
        .bg-light-purple { background-color: #dda0dd; }
        .bg-light-pink { background-color: #ffb6c1; }
        .card:hover {
            transform: scale(1.05);
            transition: transform 0.2s;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Home Page</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                {% if session['username'] == 'tohid' %}
                <li class="nav-item">
                    <a class="nav-link" href="/register">Register New User</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-light-blue text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 1</h5>
                        <p class="card-text">Content for section 1.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light-green text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 2</h5>
                        <p class="card-text">Content for section 2.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light-red text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 3</h5>
                        <p class="card-text">Content for section 3.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card bg-light-purple text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 4</h5>
                        <p class="card-text">Content for section 4.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-light-pink text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Section 5</h5>
                        <p class="card-text">Content for section 5.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
